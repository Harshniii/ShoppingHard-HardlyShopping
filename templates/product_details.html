<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('{{ url_for("static", filename="bg.jpg") }}');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .product-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .product-image {
            max-width: 200px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .product-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .back-btn {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="product-container">

    <!-- Product Image (Dynamic Icon based on product) -->
    <img src="
    {% if product.name == 'T-Shirt' %}https://img.icons8.com/color/150/000000/t-shirt.png
    {% elif product.name == 'Jeans' %}https://img.icons8.com/color/150/000000/jeans.png
    {% elif product.name == 'Sunglasses' %}https://img.icons8.com/color/150/000000/sunglasses.png
    {% elif product.name == 'Men Jacket' %}https://img.icons8.com/color/150/000000/jacket.png
    {% elif product.name == 'Smartphone' %}https://img.icons8.com/color/150/000000/smartphone.png
    {% elif product.name == 'Headphones' %}https://img.icons8.com/color/150/000000/headphones.png
    {% else %}https://img.icons8.com/color/150/000000/product.png{% endif %}
    " alt="{{ product.name }}" class="product-image">

    <!-- Product Name -->
    <h2 class="product-title">{{ product.name }}</h2>

    <!-- Product Description -->
    <p>{{ product.description }}</p>

    <!-- Product Price -->
    <p class="product-price">$ {{ product.price }}</p>

    <!-- Buttons -->
    <form method="POST" class="btn-group">
        <button name="action" value="cart" class="btn btn-warning btn-lg">Add to Cart</button>
        <button name="action" value="buy" class="btn btn-success btn-lg">Buy Now</button>
    </form>

    <!-- Back to Shop -->
    <a href="{{ url_for('shop') }}" class="btn btn-secondary back-btn">Back to Shop</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
