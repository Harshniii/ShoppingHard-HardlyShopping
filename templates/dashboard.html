<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif;
             background-image: url('static/bg.jpg'); background-size: cover;
             background-position: center; height: 100vh; display: flex;
             justify-content: center; align-items: center;">

    <div style="background-color: rgba(255, 255, 255, 0.9); padding: 40px;
                border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                width: 350px; text-align: center;">
        <h2 style="margin-bottom: 30px; color: #333;">Welcome to the Online Shopping</h2>

        <a href="{{ url_for('shop') }}" 
           style="display:block; margin: 10px 0; padding:12px; 
                  background-color:#007bff; color:#fff; text-decoration:none; 
                  border-radius:5px; font-weight:bold;">
           🛒 Go Shopping
        </a>

        <a href="{{ url_for('logout') }}" 
           style="display:block; margin: 10px 0; padding:12px;
                  background-color:#dc3545; color:#fff; text-decoration:none;
                  border-radius:5px; font-weight:bold;">
           Logout
        </a>
    </div>

</body>
</html>
